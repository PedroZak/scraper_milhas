<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milhas App</title>
  <meta name="description" content="Promoções de milhas: C6 Átomos, Livelo, Smiles e Uber.">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-gradient-to-br from-blue-900 to-indigo-800 text-white">
    <div class="max-w-4xl mx-auto px-4 pt-6 pb-5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">Milhas App</h1>
          <p class="text-sm text-blue-200">C6 Átomos · Livelo · Smiles · Uber</p>
        </div>
        <span id="status" class="text-xs text-blue-200 text-right" aria-live="polite">Carregando…</span>
      </div>

      <h2 class="mt-5 mb-2 text-sm font-semibold uppercase tracking-wide text-amber-300">
        ⚡ Alertas de Transferência
      </h2>
      <div id="alertas" class="flex gap-3 overflow-x-auto snap-x pb-2"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <h2 class="text-lg font-semibold mb-3">Compra e Varejo</h2>
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-100 text-xs uppercase text-slate-500">
          <tr>
            <th scope="col" class="px-3 py-2 whitespace-nowrap">Data</th>
            <th scope="col" class="px-3 py-2">Promoção</th>
            <th scope="col" class="px-3 py-2 hidden sm:table-cell">Fonte</th>
          </tr>
        </thead>
        <tbody id="tabela" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
