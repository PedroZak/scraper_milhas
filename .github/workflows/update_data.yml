name: Atualizar promoções

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar scraper
        run: |
          chmod +x scraper.py
          ./scraper.py

      - name: Commit e push se houver mudanças
        run: |
          if [ -z "$(git status --porcelain promocoes.json)" ]; then
            echo "Sem alterações em promocoes.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promocoes.json
          git commit -m "chore: atualiza promocoes.json"
          git push origin HEAD:main
